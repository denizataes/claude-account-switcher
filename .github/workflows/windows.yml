name: Windows build and isolated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone setup
        run: .\Build-Setup.ps1
      - name: Test account storage with fake user data
        run: .\Smoke-Test.ps1
      - name: Test consent and isolated installation
        run: .\Tray-Test.ps1
      - name: Test runtime caching and scheduling
        run: .\Runtime-Test.ps1
      - name: Test favorites and cached usage notification policy
        run: .\Preference-Test.ps1
      - name: Test hotkey mappings and preference rollback
        run: .\Hotkey-Test.ps1
      - name: Test native hotkey registration and message dispatch
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\HotkeyNative-Test.ps1
      - name: Test settings shortcut capture
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\HotkeyUI-Test.ps1
      - name: Test independent favorite keyboard and mouse input
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\FavoriteUI-Test.ps1
      - name: Test typed token routes and recovery with fake user data
        run: .\Token-Test.ps1
      - name: Test read-only token validation with mocked HTTP
        run: .\TokenValidation-Test.ps1
      - name: Test masked token dialog cancellation with a slow mock
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\TokenUI-Test.ps1
      - name: Test mocked usage and nested card selection
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Usage-Test.ps1
      - name: Test owner-painted control semantics
        run: .\Rendering-Test.ps1
      - name: Test setup in an isolated directory and registry key
        run: |
          $process = Start-Process -FilePath .\Claude-Hesap-Setup.exe -ArgumentList '/test' -WindowStyle Hidden -PassThru
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw 'Setup self-test failed' }
      - name: Test standalone executable without companion files
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Standalone-Test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: claude-account-switcher-windows
          path: Claude-Hesap-Setup.exe
