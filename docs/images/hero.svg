<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Claude Code Account Switcher for Windows</title>
  <desc id="description">An unofficial Windows tray app for account switching, favorites, and cached usage limits.</desc>
  <rect width="1200" height="320" rx="24" fill="#FAF9F5"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#E8E0D8" stroke-width="2"/>
  <text x="64" y="65" fill="#C15F3C" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">CLAUDE CODE ACCOUNT SWITCHER</text>
  <text x="62" y="132" fill="#3D3A36" font-family="Georgia,serif" font-size="54">Your accounts, one tray away.</text>
  <text x="64" y="177" fill="#81776E" font-family="Segoe UI,Arial,sans-serif" font-size="23">Pick a favorite. Check your limits. Get back to work.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#3D3A36">
