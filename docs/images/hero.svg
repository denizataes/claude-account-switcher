    <rect x="238" y="218" width="150" height="40" rx="20" fill="#F3E6DD"/>
    <text x="313" y="244" text-anchor="middle">USAGE LIMITS</text>
    <rect x="402" y="218" width="165" height="40" rx="20" fill="#F3E6DD"/>
    <text x="484" y="244" text-anchor="middle">WINDOWS TRAY</text>
  </g>
  <g transform="translate(1028 155)">
    <circle r="100" fill="#F3E6DD"/>
    <g fill="#D97757">
      <path d="M-8-85H8L12-42L35-68L48-56L23-21L66-31L70-13L31 0L70 13L66 31L23 21L48 56L35 68L12 42L8 85H-8L-12 42L-35 68L-48 56L-23 21L-66 31L-70 13L-31 0L-70-13L-66-31L-23-21L-48-56L-35-68L-12-42Z"/>
    </g>
    <circle r="35" fill="#FAF9F5"/>
    <g fill="none" stroke="#C15F3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
